<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pandoc CSS 预览</title>
  <style>
    body {
      font-family: "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
      margin: 1.5rem auto 3rem;
      max-width: 72rem;
      line-height: 1.5;
    }
    h1 { font-size: 1.4rem; margin: 0 0 0.4rem; }
    .lead { color: #555; margin: 0 0 1.4rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr));
      gap: 1rem;
    }
    figure {
      margin: 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      background: #fafafa;
    }
    figcaption {
      padding: 0.65rem 0.8rem 0.75rem;
      border-top: 1px solid #eee;
    }
    figcaption a { font-weight: 700; color: inherit; text-decoration: none; }
    figcaption a:hover { color: #0969da; }
    figcaption span { display: block; color: #666; font-size: 0.85rem; }
    img { display: block; width: 100%; height: auto; background: #fff; }
  </style>
</head>
<body>
  <h1>Pandoc CSS 预览</h1>
  <p class="lead">同一份 <code>sample.md</code>，七套主题。点标题打开对应的独立 HTML。</p>
  <div class="grid">
    <figure>
      <a href="github-doc.html"><img src="github-doc.png" alt="GitHub 文档" /></a>
      <figcaption><a href="github-doc.html">GitHub 文档</a><span>github-doc.css</span></figcaption>
    </figure>
    <figure>
      <a href="tufte-essay.html"><img src="tufte-essay.png" alt="Tufte 随笔" /></a>
      <figcaption><a href="tufte-essay.html">Tufte 随笔</a><span>tufte-essay.css</span></figcaption>
    </figure>
    <figure>
      <a href="sakura-warm.html"><img src="sakura-warm.png" alt="Sakura 暖灰" /></a>
      <figcaption><a href="sakura-warm.html">Sakura 暖灰</a><span>sakura-warm.css</span></figcaption>
    </figure>
    <figure>
      <a href="pico-product.html"><img src="pico-product.png" alt="Pico 产品" /></a>
      <figcaption><a href="pico-product.html">Pico 产品</a><span>pico-product.css</span></figcaption>
    </figure>
    <figure>
      <a href="nord-night.html"><img src="nord-night.png" alt="Nord 深色" /></a>
      <figcaption><a href="nord-night.html">Nord 深色</a><span>nord-night.css</span></figcaption>
    </figure>
    <figure>
      <a href="songti-report.html"><img src="songti-report.png" alt="宋体报告" /></a>
      <figcaption><a href="songti-report.html">宋体报告</a><span>songti-report.css</span></figcaption>
    </figure>
    <figure>
      <a href="swiss-plain.html"><img src="swiss-plain.png" alt="瑞士平面" /></a>
      <figcaption><a href="swiss-plain.html">瑞士平面</a><span>swiss-plain.css</span></figcaption>
    </figure>
  </div>
</body>
</html>

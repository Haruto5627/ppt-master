<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>清新 CSS 预览</title>
  <style>
    body { font-family: "Noto Sans CJK SC", sans-serif; margin: 1.5rem auto 3rem; max-width: 72rem; }
    h1 { font-size: 1.35rem; margin: 0 0 .4rem; }
    .lead { color: #5b6b66; margin: 0 0 1.3rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr)); gap: 1rem; }
    figure { margin: 0; border: 1px solid #d7efe6; border-radius: 16px; overflow: hidden; background: #fff; }
    figcaption { padding: .65rem .8rem .75rem; }
    figcaption a { font-weight: 700; color: #14685c; text-decoration: none; }
    figcaption span { display: block; color: #6b7c75; font-size: .85rem; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>清新卡片预览</h1>
  <p class="lead">同一份 sample.md。点标题打开独立 HTML。</p>
  <div class="grid">
    <figure>
      <a href="fresh-mint.html"><img src="fresh-mint.png" alt="薄荷绿" /></a>
      <figcaption><a href="fresh-mint.html">薄荷绿</a><span>fresh-mint.css</span></figcaption>
    </figure>
    <figure>
      <a href="fresh-sky.html"><img src="fresh-sky.png" alt="天空蓝" /></a>
      <figcaption><a href="fresh-sky.html">天空蓝</a><span>fresh-sky.css</span></figcaption>
    </figure>
    <figure>
      <a href="fresh-peach.html"><img src="fresh-peach.png" alt="蜜桃粉" /></a>
      <figcaption><a href="fresh-peach.html">蜜桃粉</a><span>fresh-peach.css</span></figcaption>
    </figure>
    <figure>
      <a href="fresh-lilac.html"><img src="fresh-lilac.png" alt="丁香紫" /></a>
      <figcaption><a href="fresh-lilac.html">丁香紫</a><span>fresh-lilac.css</span></figcaption>
    </figure>
    <figure>
      <a href="fresh-latte.html"><img src="fresh-latte.png" alt="Latte 奶茶" /></a>
      <figcaption><a href="fresh-latte.html">Latte 奶茶</a><span>fresh-latte.css</span></figcaption>
    </figure>
  </div>
</body>
</html>
